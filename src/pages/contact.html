<section class="page-hero wrap"><span class="eyebrow">Start a conversation</span><h1 class="page-title reveal-text">What are you<br><em>working on?</em></h1><p class="lead">Share a little about the challenge. We’ll make the next step clear.</p></section>
<section class="section wrap contact-layout"><div class="contact-aside"><span class="eyebrow">What happens next</span><ol class="next-steps"><li><span>01</span>Discovery</li><li><span>02</span>Direction</li><li><span>03</span>Proposal</li><li><span>04</span>Execution</li></ol><p><a href="tel:{{phone_link}}">{{phone_display}}</a><br><a href="mailto:{{email}}">{{email}}</a></p><p>{{address}}</p></div>
<form class="project-form" data-contact-form novalidate>
  <label>Name<input name="name" autocomplete="name" required minlength="2"></label>
  <label>Email<input name="email" type="email" autocomplete="email" required></label>
  <label>Phone<input name="phone" type="tel" autocomplete="tel" required></label>
  <label>What do you need help with?<select name="need" required><option value="">Choose one</option><option>Brand strategy</option><option>Website design & development</option><option>UI/UX & digital experiences</option><option>Performance marketing</option><option>Social media marketing</option><option>SEO & organic growth</option><option>Creative content production</option><option>Influencer & campaign marketing</option><option>Something else</option></select></label>
  <label>Budget range<select name="budget" required><option value="">Choose a range</option><option>To be discussed</option><option>Under ₹1 lakh</option><option>₹1–3 lakh</option><option>₹3–5 lakh</option><option>₹5 lakh and above</option></select></label>
  <label class="form-wide">Project details<textarea name="message" rows="5" required minlength="12"></textarea></label>
  <label class="honeypot" aria-hidden="true">Leave this field empty<input name="website" tabindex="-1" autocomplete="off"></label>
  <p class="form-note form-wide" data-form-note>We use these details only to reply to your enquiry.</p>
  <div class="form-status form-wide" data-form-status aria-live="polite"></div>
  <button class="button button-primary form-wide" type="submit">Send enquiry <span aria-hidden="true">↗</span></button>
</form></section>
