<article class="article-shell section wrap">
  <div class="article-topline"><a class="eyebrow" href="/blogs.html">Journal</a><span>{{category}}</span><time datetime="{{date}}">{{date_display}}</time></div>
  <h1 class="article-title">{{title}}</h1><p class="article-deck">{{description}}</p>
  <figure class="article-cover"><img src="{{image}}" alt="{{image_alt}}" width="1200" height="720" fetchpriority="high"></figure>
  <div class="article-grid-layout"><div class="article-body prose">{{body}}</div><aside class="article-aside"><span class="eyebrow">Need a clearer next step?</span><p>Explore how Creative Nerds can support your brand.</p><a class="text-link" href="{{service_url}}">{{service_name}} ↗</a></aside></div>
</article>
