<article class="project-card reveal tilt-card" data-category="{{category_key}}" data-tilt>
  <a class="project-visual" href="{{case_url}}" aria-label="View case study: {{client}}">
    {{visual}}
    <span class="project-open" aria-hidden="true">↗</span>
  </a>
  <div class="project-meta"><span>{{category}}</span><span>{{relationship}}</span></div>
  <h3><a href="{{case_url}}">{{client}}</a></h3>
  <p>{{summary}}</p>
  <div class="project-actions">{{external_link}}<a href="{{case_url}}">View case study <span aria-hidden="true">↗</span></a></div>
</article>
